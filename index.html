<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="style.css">
</head><body>
<title>Sprig</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">


<div class="phone" id="phone">
  <div class="view">
    <main class="scroll" id="scroll" aria-live="off"></main>
    <div class="dock">
      <button class="cartbar" id="cartbar" data-act="sheet" data-sheet="cart" hidden></button>
      <button class="ask" data-act="ai-open" aria-label="Open the AI assistant">
        <span class="logo"></span><span class="t">Ask Anything...</span>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 15 12 9 18 15"/></svg>
      </button>
    </div>

    <section class="ai" id="ai" hidden aria-label="AI Assistant">
      <div class="ai-head">
        <div><b>AI Assistant</b><small>Ask anything about your order</small></div>
        <button class="xbtn" data-act="ai-close" aria-label="Close assistant"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="ai-body" id="aibody">
        <div class="ai-hello"><p>Hello <span id="aiName"></span>!</p><h2>How can I help you today?</h2></div>
        <div class="msgs" id="msgs" aria-live="polite"></div>
      </div>
      <div class="chips" id="chips">
        <button class="chip" data-act="chip" data-text="Where is my rider?">Where is my rider?</button>
        <button class="chip" data-act="chip" data-text="What's in my order?">What's in my order?</button>
        <button class="chip" data-act="chip" data-text="Add milk">Add milk</button>
        <button class="chip" data-act="chip" data-text="What is the delivery fee?">Delivery fee</button>
      </div>
      <form class="ai-input" id="aiform" autocomplete="off">
        <input id="aiq" type="text" placeholder="Ask Anything..." aria-label="Ask the assistant">
        <button type="submit" id="aisend" aria-label="Send"></button>
      </form>
    </section>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>

  <div class="scrim" id="scrim" data-act="close-sheet" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>




<script src="script.js"></script>
</body></html>
